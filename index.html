<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Break-Even Simulator for Mechanical Start-ups</title>
<style>
:root{--bg:#f4f8f5;--card:#fff;--tx:#17302a;--mu:#5b7068;--pr:#1f9d6b;--bd:#dbe6df;--rev:#2b6cb0;--cost:#c0392b;--grid:#e8eeea;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a16;--card:#17261f;--tx:#e6f1ea;--mu:#93aaa0;--pr:#3dd197;--bd:#274034;--rev:#63a4ff;--cost:#ef6a5b;--grid:#223a2f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1a16;--card:#17261f;--tx:#e6f1ea;--mu:#93aaa0;--pr:#3dd197;--bd:#274034;--rev:#63a4ff;--cost:#ef6a5b;--grid:#223a2f;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}
header{padding:18px 16px 4px;max-width:900px;margin:auto}
h1{font-size:1.4rem;margin:0}.sub{color:var(--mu);font-size:.88rem}
main{max-width:900px;margin:auto;padding:10px 16px 40px;display:grid;gap:12px;grid-template-columns:300px 1fr}
@media(max-width:760px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px}
.card h2{font-size:.95rem;margin:0 0 8px}
label{display:block;font-size:.8rem;color:var(--mu);margin:8px 0 3px}
input{width:100%;padding:9px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:1rem}
.r{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--bd);font-size:.9rem}
.r:last-child{border:0}.r b{text-align:right}
#v{font-weight:700;margin-bottom:8px}.ok{color:var(--pr)}.bad{color:var(--cost)}
canvas{width:100%;height:320px;display:block}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th,td{padding:7px;text-align:center;border-bottom:1px solid var(--bd)}
th{color:var(--mu);font-weight:600}
button{background:var(--pr);color:#fff;border:0;border-radius:10px;padding:9px 14px;font-size:.9rem;cursor:pointer;margin-top:10px}
.note{font-size:.78rem;color:var(--mu);margin-top:8px}
.col{display:grid;gap:12px;align-content:start}
</style>
</head>
<body>
<header><h1>Break-Even Simulator</h1><div class="sub">Find how many units a mechanical start-up must sell to cover all costs.</div></header>
<main>
<div class="col">
<div class="card"><h2>Inputs</h2>
<label>Fixed costs per period (rent, salaries, machines)</label><input id="fixed" type="number" inputmode="decimal" value="150000">
<label>Selling price per unit</label><input id="price" type="number" inputmode="decimal" value="850">
<label>Variable cost per unit (material, labour, power)</label><input id="var" type="number" inputmode="decimal" value="500">
<label>Expected sales (units)</label><input id="exp" type="number" inputmode="decimal" value="600">
<label>Target profit (optional)</label><input id="tgt" type="number" inputmode="decimal" value="50000">
<button id="reset">Reset sample values</button></div>
<div class="card"><h2>Results</h2><div id="res"></div></div>
</div>
<div class="col">
<div class="card"><div id="v"></div><canvas id="cv"></canvas></div>
<div class="card"><h2>What-if: change selling price</h2><div class="tw"><table id="tb"></table></div>
<div class="note">Break-even units = Fixed cost ÷ (Price − Variable cost). Educational tool; figures depend on your inputs.</div></div>
</div>
</main>
<script>
var D={fixed:150000,price:850,var:500,exp:600,tgt:50000},ids=['fixed','price','var','exp','tgt'];
function $(i){return document.getElementById(i)}
function inr(x){return 'Rs '+Math.round(x).toLocaleString('en-IN')}
function n(x){return Math.round(x).toLocaleString('en-IN')}
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()}
function read(){var o={};ids.forEach(function(k){o[k]=parseFloat($(k).value)||0});return o}
function calc(o){var cm=o.price-o.var;if(o.price<=0||cm<=0)return null;var be=o.fixed/cm;
return{cm:cm,ratio:cm/o.price*100,be:be,rev:be*o.price,profit:o.exp*cm-o.fixed,tu:(o.fixed+o.tgt)/cm,ms:o.exp?(o.exp-be)/o.exp*100:0}}
function run(){var o=read(),r=calc(o),v=$('v');
if(!r){v.className='bad';v.textContent='Selling price must be higher than variable cost per unit.';$('res').innerHTML='';$('tb').innerHTML='';cv();return}
var rows=[['Break-even units',n(r.be)+' units'],['Break-even revenue',inr(r.rev)],['Contribution / unit',inr(r.cm)],['Contribution margin',r.ratio.toFixed(1)+'%'],['Profit at expected sales',inr(r.profit)],['Margin of safety',r.ms.toFixed(1)+'%'],['Units for target profit',n(r.tu)+' units']];
$('res').innerHTML=rows.map(function(x){return '<div class="r"><span>'+x[0]+'</span><b>'+x[1]+'</b></div>'}).join('');
if(o.exp>=r.be){v.className='ok';v.textContent='Profitable: expected sales are '+n(o.exp-r.be)+' units above break-even.'}
else{v.className='bad';v.textContent='Loss: you need '+n(r.be-o.exp)+' more units to break even.'}
var t='<tr><th>Price</th><th>Break-even units</th><th>Profit at expected sales</th></tr>';
[-10,-5,0,5,10].forEach(function(p){var pr=o.price*(1+p/100),m=pr-o.var;
t+='<tr><td>'+n(pr)+' ('+(p>0?'+':'')+p+'%)</td><td>'+(m>0?n(o.fixed/m):'none')+'</td><td>'+(m>0?inr(o.exp*m-o.fixed):'-')+'</td></tr>'});
$('tb').innerHTML=t;draw(o,r)}
function cv(){var c=$('cv'),x=c.getContext('2d');x.clearRect(0,0,c.width,c.height)}
function draw(o,r){var c=$('cv'),dpr=window.devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;c.width=w*dpr;c.height=h*dpr;
var x=c.getContext('2d');x.scale(dpr,dpr);x.clearRect(0,0,w,h);
var L=56,R=14,T=26,B=34,xm=Math.max(r.be*1.6,o.exp*1.2,10),ym=Math.max(xm*o.price,o.fixed+xm*o.var)*1.05;
function X(v){return L+v/xm*(w-L-R)}function Y(v){return h-B-v/ym*(h-T-B)}
var tx=css('--tx'),mu=css('--mu'),gr=css('--grid'),rev=css('--rev'),co=css('--cost'),pr=css('--pr');
x.font='11px system-ui,sans-serif';x.lineWidth=1;
for(var i=0;i<=5;i++){var yv=ym*i/5,xv=xm*i/5;x.strokeStyle=gr;x.beginPath();x.moveTo(L,Y(yv));x.lineTo(w-R,Y(yv));x.stroke();
x.fillStyle=mu;x.textAlign='right';x.fillText(Math.round(yv/1000)+'k',L-6,Y(yv)+4);x.textAlign='center';x.fillText(Math.round(xv),X(xv),h-B+16)}
x.fillStyle=tx;x.textAlign='center';x.fillText('Units sold',(L+w-R)/2,h-6);
function line(a,b,c2,d,col,wd,dash){x.strokeStyle=col;x.lineWidth=wd;x.setLineDash(dash||[]);x.beginPath();x.moveTo(X(a),Y(b));x.lineTo(X(c2),Y(d));x.stroke();x.setLineDash([])}
line(0,o.fixed,xm,o.fixed,mu,1,[4,3]);line(0,o.fixed,xm,o.fixed+xm*o.var,co,2.5);line(0,0,xm,xm*o.price,rev,2.5);
line(o.exp,0,o.exp,o.exp*o.price,pr,1.5,[3,3]);
x.fillStyle=pr;x.beginPath();x.arc(X(r.be),Y(r.rev),6,0,7);x.fill();
x.fillStyle=pr;x.textAlign=r.be>xm*.6?'right':'left';x.font='bold 12px system-ui,sans-serif';
x.fillText('Break-even: '+n(r.be)+' units',X(r.be)+(r.be>xm*.6?-10:10),Y(r.rev)+20);
x.font='11px system-ui,sans-serif';x.textAlign='left';var lx=L+8;
[[rev,'Revenue'],[co,'Total cost'],[mu,'Fixed cost']].forEach(function(l){x.fillStyle=l[0];x.fillRect(lx,T-14,14,5);x.fillStyle=tx;x.fillText(l[1],lx+20,T-8);lx+=90})}
ids.forEach(function(k){$(k).addEventListener('input',run)});
$('reset').onclick=function(){ids.forEach(function(k){$(k).value=D[k]});run()};
window.addEventListener('resize',run);run();
</script>
</body>
</html>
